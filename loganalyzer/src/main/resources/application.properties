spring.application.name=loganalyzer

# Server Port
server.port=8080

# MySQL Database Configuration (Environment Variable ready)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devguard_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:your_local_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true